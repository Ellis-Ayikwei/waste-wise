<!DOCTYPE html>
<html>
<head>
    <title>Admin WebSocket Test</title>
</head>
<body>
    <h1>Admin WebSocket Test</h1>
    <div id="status">Connecting...</div>
    <div id="messages"></div>
    
    <script>
        const statusDiv = document.getElementById('status');
        const messagesDiv = document.getElementById('messages');
        
        function addMessage(message) {
            const p = document.createElement('p');
            p.textContent = new Date().toLocaleTimeString() + ': ' + message;
            messagesDiv.appendChild(p);
            console.log(message);
        }
        
        // Test WebSocket connection
        const wsUrl = 'ws://localhost:8000/ws/admin/';
        addMessage('Connecting to: ' + wsUrl);
        
        const ws = new WebSocket(wsUrl);
        
        ws.onopen = function(event) {
            statusDiv.textContent = 'Connected';
            statusDiv.style.color = 'green';
            addMessage('✅ WebSocket connected');
        };
        
        ws.onmessage = function(event) {
            addMessage('📨 Received: ' + event.data);
            try {
                const data = JSON.parse(event.data);
                addMessage('📋 Parsed: ' + JSON.stringify(data, null, 2));
            } catch (e) {
                addMessage('❌ Parse error: ' + e.message);
            }
        };
        
        ws.onclose = function(event) {
            statusDiv.textContent = 'Disconnected';
            statusDiv.style.color = 'red';
            addMessage('❌ WebSocket closed: ' + event.code + ' ' + event.reason);
        };
        
        ws.onerror = function(error) {
            statusDiv.textContent = 'Error';
            statusDiv.style.color = 'red';
            addMessage('❌ WebSocket error: ' + error);
        };
        
        // Send test message after 2 seconds
        setTimeout(() => {
            if (ws.readyState === WebSocket.OPEN) {
                const testMessage = {
                    type: 'ping',
                    timestamp: new Date().toISOString()
                };
                ws.send(JSON.stringify(testMessage));
                addMessage('📤 Sent ping message');
            }
        }, 2000);
    </script>
</body>
</html>
